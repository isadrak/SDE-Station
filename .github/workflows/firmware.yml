name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["firmware/**", "app/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", "app/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: arduino/setup-arduino-cli@v2

      - uses: actions/cache@v5
        with:
          path: ~/.arduino15
          key: arduino-esp32-${{ hashFiles('firmware/build.sh') }}

      - name: Compiler
        run: |
          pip install pyserial esptool==4.8.1
          echo "VER=$(cat firmware/VERSION)" >> $GITHUB_ENV
          set -o pipefail
          firmware/build.sh --setup 2>&1 | tee build.log || {
            grep -E "error|Error|overflow" build.log | head -n 20 | while read -r l; do echo "::error::$l"; done
            exit 1
          }
          grep -E "Sketch uses|Global variables" build.log | while read -r l; do echo "::notice::$l"; done

      - uses: actions/upload-artifact@v5
        with:
          name: sde-firmware-${{ env.VER }}
          path: firmware/dist/*.bin

      - name: Publier la Release
        # Sur un tag v*, ou sur un push dont le message contient [release] (crée le tag v<VERSION>)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          name: SDE v${{ env.VER }}
          body: |
            | Fichier | Usage |
            |---|---|
            | `sde-firmware-${{ env.VER }}-merged.bin` | Premier flash par USB, à l'adresse `0x0` ([ESP Tool](https://espressif.github.io/esptool-js/)) |
            | `sde-firmware-${{ env.VER }}-ota.bin` | Mise à jour par Wi-Fi : appli > Réglages > Mise à jour |
            | `sde.apk` | Appli Android (Android 6+) |

            Binaires compilés par GitHub Actions depuis ce tag. Mode d'emploi : [guide d'utilisation](https://github.com/${{ github.repository }}/blob/main/docs/guide-utilisation.md).
          files: |
            firmware/dist/*.bin
            android/sde.apk
