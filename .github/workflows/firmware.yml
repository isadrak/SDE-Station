name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["firmware/**", "app/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", "app/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: arduino/setup-arduino-cli@v2

      - uses: actions/cache@v5
        with:
          path: ~/.arduino15
          key: arduino-esp32-${{ hashFiles('firmware/build.sh') }}

      - name: Compiler
        run: |
          pip install pyserial esptool==4.8.1
          echo "VER=$(cat firmware/VERSION)" >> $GITHUB_ENV
          set -o pipefail
          firmware/build.sh --setup 2>&1 | tee build.log || {
            grep -E "error|Error|overflow" build.log | head -n 20 | while read -r l; do echo "::error::$l"; done
            exit 1
          }
          grep -E "Sketch uses|Global variables" build.log | while read -r l; do echo "::notice::$l"; done

      - uses: actions/upload-artifact@v5
        with:
          name: sde-firmware-${{ env.VER }}
          path: firmware/dist/*.bin

      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware/dist/*.bin
            android/sde.apk
