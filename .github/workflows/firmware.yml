name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["firmware/**", "app/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", "app/**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  ESP32_CORE: "2.0.17"
  FQBN: esp32:esp32:esp32

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: arduino/setup-arduino-cli@v2

      - uses: actions/cache@v5
        with:
          path: ~/.arduino15
          key: arduino-esp32-${{ env.ESP32_CORE }}-v1

      - name: Installer le cœur ESP32 et les bibliothèques
        run: |
          pip install pyserial esptool==4.8.1
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@$ESP32_CORE --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "Adafruit BME680 Library" "Adafruit Unified Sensor" "Adafruit BusIO" ArduinoJson@7.2.1 "Adafruit NeoPixel@1.12.3"

      - name: Compiler
        run: |
          set -o pipefail
          VER=$(sed -n 's/.*SDE_FW_VERSION=\\"\([^\\]*\)\\".*/\1/p' firmware/platformio.ini)
          echo "VER=$VER" >> $GITHUB_ENV
          node firmware/tools/gen_assets.js
          # Croquis Arduino : un .ino vide + le dossier src/ du firmware
          mkdir -p sketch/sde && touch sketch/sde/sde.ino && cp -r firmware/src sketch/sde/src
          arduino-cli compile --fqbn $FQBN --output-dir out \
            --build-property "compiler.cpp.extra_flags=-DSDE_FW_VERSION=\"$VER\"" \
            sketch/sde 2>&1 | tee build.log || {
            grep -E "error|Error|overflow" build.log | head -n 20 | while read -r l; do echo "::error::$l"; done
            echo "::error::$(tail -n 5 build.log | tr '\n' ' ')"
            exit 1
          }
          grep -E "Sketch uses|Global variables" build.log | while read -r l; do echo "::notice::$l"; done

      - name: Préparer les binaires (OTA + image complète pour 0x0)
        run: |
          mkdir -p dist
          cp out/sde.ino.bin dist/sde-firmware-$VER-ota.bin
          python -m esptool --chip esp32 merge_bin -o dist/sde-firmware-$VER-merged.bin \
            --flash_mode keep --flash_freq keep --flash_size keep \
            0x1000 out/sde.ino.bootloader.bin 0x8000 out/sde.ino.partitions.bin \
            0xe000 ~/.arduino15/packages/esp32/hardware/esp32/$ESP32_CORE/tools/partitions/boot_app0.bin \
            0x10000 out/sde.ino.bin
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: sde-firmware-${{ env.VER }}
          path: dist/*.bin

      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
