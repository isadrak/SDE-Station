; SDE - Station de Diagnostic Environnemental
; Firmware de la carrier board ESP32-DevKitC-32E

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DSDE_FW_VERSION=\"0.9.8\"
lib_deps =
    adafruit/Adafruit BME680 Library@^2.0.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@7.2.1
    adafruit/Adafruit NeoPixel@1.12.3
board_build.filesystem = littlefs
; Intègre app/ dans le firmware (src/web/assets.h) avant chaque compilation
extra_scripts = pre:tools/pre_build.py

; Mise à jour par Wi-Fi : depuis l'appli (Réglages > Mise à jour, fichier -ota.bin),
; ou curl -F "f=@sde-firmware-X-ota.bin" "http://sde.local/api/update?pass=<mot de passe>".
